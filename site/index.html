<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontrolna soba — web programiranje</title>
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/client/css/soba.css" />
  </head>
  <body>
    <a class="skip" href="#cas">Preskoči na čas</a>
    <header class="top">
      <a class="brand" href="#cas-1">Kontrolna soba</a>
      <form id="search-form" role="search">
        <label class="sr" for="q">Nađi pojam</label>
        <input id="q" type="search" placeholder="Nađi pojam" autocomplete="off" />
      </form>
      <p class="meta">10 časova</p>
    </header>
    <nav id="nav" class="nav" aria-label="Časovi"></nav>
    <main class="layout">
      <article id="cas" class="cas"></article>
      <section class="panel" aria-label="Kontrolna soba">
        <div class="room" id="soba-prekidaca">
          <header class="room-h">
            <h2>Soba prekidača</h2>
            <span id="starost" class="starost" hidden></span>
          </header>
          <p class="digit" id="displej" aria-live="polite">24</p>
          <p id="prag" class="meta" hidden>prag 30</p>
          <p id="stanje-citanja" class="log" hidden></p>
          <div class="row">
            <button type="button" id="prekidac" aria-pressed="false">Uključi</button>
            <button type="button" id="sledeci">Sledeći korak</button>
            <button type="button" id="procitaj" hidden>Pročitaj</button>
            <button type="button" id="polling" hidden aria-pressed="false">Periodično</button>
            <button type="button" id="svezina" hidden aria-pressed="true">Provera svežine</button>
          </div>
          <div class="fan-local" id="fan-local" hidden aria-hidden="true">
            <span class="blades" id="blades-local"></span>
          </div>
          <p id="log" class="log" hidden></p>
          <canvas id="grafikon" width="320" height="84" hidden aria-label="Linija visina iz niza"></canvas>
        </div>
        <div class="room machine" id="soba-masina" hidden>
          <header class="room-h"><h2>Soba mašina</h2></header>
          <p class="digit" id="displej-masina">24</p>
          <div class="fan" id="fan" aria-hidden="true"><span class="blades" id="blades"></span></div>
          <ol id="istorija" hidden></ol>
          <button type="button" id="kabl" hidden>Kabl je u kutiji</button>
          <div class="sesije" id="sesije" hidden>
            <button type="button" id="ses-pos">Posmatrač</button>
            <button type="button" id="ses-ope">Operater</button>
            <button type="button" id="ses-ne">Bez sesije</button>
          </div>
          <p id="kutija-msg" class="log"></p>
        </div>
      </section>
      <section class="files" id="files" aria-label="Fajlovi">
        <div class="tabs" role="tablist" aria-label="Strana">
          <button type="button" id="tab-front" role="tab" aria-selected="true" aria-controls="tree">Front</button>
          <button type="button" id="tab-back" role="tab" aria-selected="false" aria-controls="tree">Back</button>
        </div>
        <div class="file-layout">
          <div id="tree" class="tree"></div>
          <div class="editor" id="editor-wrap">
            <span id="putanja">client/css/soba.css</span>
            <textarea id="editor" spellcheck="false" aria-label="Sadržaj fajla"></textarea>
            <span class="row">
              <button type="button" id="sacuvaj">Sačuvaj</button>
              <button type="button" id="povrati">Povrati</button>
            </span>
            <span id="editor-err" class="err" role="status"></span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
